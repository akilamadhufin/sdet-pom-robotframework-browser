# ================================
# Project Metadata
# Defines the basic information about automation project.
# This is the modern replacement for setup.py and requirements.txt.
# ================================
[project]
name = "basic-swt"                     # The name of your automation project/package
version = "1.0.0"                      # Project version (useful for packaging or CI)
description = "UI automation tests using Robot Framework Browser"  # Short description
requires-python = ">=3.9"              # Minimum Python version required to run tests

# ================================
# Project Dependencies
# These are installed automatically when tox creates the environment.
# This replaces requirements.txt in modern Python projects.
# ================================
dependencies = [
    "robotframework",                  # Core Robot Framework test runner
    "robotframework-browser",          # Browser library (Playwright-based UI automation)
    "robotframework-retryfailed",      # Listener to retry failed tests automatically
    "robotframework-pythonlibcore",     # Required internal library for Browser & RF extensions
    "requests"                         # HTTP client for API cleanup and API keywords
]

# ================================
# Robot Framework Tool Configuration
# Optional section for configuring Robot Framework defaults.
# Tools like robotidy, robocop, or robot CLI can read this.
# ================================
[tool.robot]
loglevel = "INFO"                      # Default log level for Robot test execution